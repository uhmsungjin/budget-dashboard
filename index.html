      const summary = useMemo(() => {
        let totalIncome = 0;
        let totalExpense = 0;
        let expense2026 = 0;
        let expense2027 = 0;

        transactions.forEach(t => {
          const yr = (t.date || '').slice(0, 4);
          if (t.type === 'income' || t.category === '입금') {
            totalIncome += Math.abs(Number(t.amount) || 0);
          } else {
            const amt = Number(t.amount) || 0;
            totalExpense += amt;
            if (yr === '2026') expense2026 += amt;
            else if (yr === '2027') expense2027 += amt;
          }
        });

        const balance = totalIncome - totalExpense;
        const rate = totalIncome > 0 ? ((totalExpense / totalIncome) * 100).toFixed(1) : '0.0';
        return { totalIncome, totalExpense, expense2026, expense2027, balance, rate };
      }, [transactions]);

      // 카테고리/비목별 사용액 계산
      const getUsed = (category, item, year) => {
        return transactions
          .filter(t => {
            if (t.type === 'income' || t.category === '입금') return false;
            if (year && !(t.date || '').startsWith(String(year))) return false;
            if (category === '인건비') return t.category === '인건비';
            if (category === '외주비') return t.category === '외주비';
            return t.category === `경비 - ${item}`;
          })
          .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
      };

      // 예산 집계 (엑셀 수식 100% 일치)
      const calc = useMemo(() => {
        const sumByCat = (cat) => {
          const rows = budgetItems.filter(b => b.category === cat);
          const b26 = rows.reduce((s, r) => s + Number(r.b2026 || 0), 0);
          const b27 = rows.reduce((s, r) => s + Number(r.b2027 || 0), 0);
          return { rows, b26, b27, tot: b26 + b27 };
        };

        const labor = sumByCat('인건비');
        const outsource = sumByCat('외주비');
        const expense = sumByCat('경비');

        const net26 = labor.b26 + outsource.b26 + expense.b26;
        const net27 = labor.b27 + outsource.b27 + expense.b27;
        const netTot = net26 + net27;

        const admin26 = Math.round(net26 * 0.05);
        const admin27 = Math.round(net27 * 0.05);
        const adminTot = admin26 + admin27;

        const profit26 = Math.round((net26 + admin26) * 0.03);
        const profit27 = Math.round((net27 + admin27) * 0.03);
        const profitTot = profit26 + profit27;

        const op26 = net26 + admin26 + profit26;
        const op27 = net27 + admin27 + profit27;
        const opTot = op26 + op27;

        const vat26 = Math.round(op26 * 0.1);
        const vat27 = Math.round(op27 * 0.1);
        const vatTot = Math.round(opTot * 0.1);

        const tot26 = op26 + vat26;
        const tot27 = op27 + vat27;
        const totAll = opTot + vatTot;

        const final26 = Math.floor(tot26 / 10000) * 10000;
        const final27 = Math.floor(tot27 / 10000) * 10000;
        const finalAll = Math.floor(totAll / 100000) * 100000;

        const usedLabor26 = getUsed('인건비', null, 2026);
        const usedLabor27 = getUsed('인건비', null, 2027);
        const usedOut26 = getUsed('외주비', null, 2026);
        const usedOut27 = getUsed('외주비', null, 2027);

        const expItems = ['브랜드 개발비', '프로그램 운영비', '홍보비', '유지 관리비', '기타경비'];
        const usedExp26 = expItems.reduce((s, it) => s + getUsed('경비', it, 2026), 0);
        const usedExp27 = expItems.reduce((s, it) => s + getUsed('경비', it, 2027), 0);

        return {
          labor, outsource, expense,
          net26, net27, netTot,
          admin26, admin27, adminTot,
          profit26, profit27, profitTot,
          op26, op27, opTot,
          vat26, vat27, vatTot,
          tot26, tot27, totAll,
          final26, final27, finalAll,
          usedLabor26, usedLabor27,
          usedOut26, usedOut27,
          usedExp26, usedExp27
        };
      }, [budgetItems, transactions]);

      // 엑셀 파일 업로드 처리
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!window.XLSX) {
          showToast('엑셀 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.');
          return;
        }
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const wb = window.XLSX.read(evt.target.result, { type: 'binary' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = window.XLSX.utils.sheet_to_json(ws);

            let maxId = transactions.reduce((m, t) => Math.max(m, t.id), 0);
            const added = [];

            rows.forEach((row) => {
              const rawDate = row['거래일시'] || row['날짜'] || '';
              const dateStr = String(rawDate).slice(0, 10).replace(/\./g, '-');
              const inAmt = Number(String(row['입금액'] || '0').replace(/[^0-9.-]/g, '')) || 0;
              const outAmt = Number(String(row['출금액'] || '0').replace(/[^0-9.-]/g, '')) || 0;
              const desc = row['적요'] || row['내용'] || '통장 거래';
              const vendor = row['내용'] || row['사용처'] || row['거래점명'] || '';
              const note = row['메모'] || row['비고'] || '';

              if (!dateStr || (inAmt === 0 && outAmt === 0)) return;

              maxId += 1;
              if (inAmt > 0) {
                added.push({
                  id: maxId, date: dateStr, category: '입금', desc, vendor,
                  amount: inAmt, type: 'income', method: '계좌이체', note
                });
              } else {
                let autoCat = '경비 - 유지 관리비';
                const text = `${desc} ${vendor} ${note}`;
                if (text.includes('블랭크') || text.includes('인건비')) autoCat = '인건비';
                else if (text.includes('고라니') || text.includes('박영민') || text.includes('용역')) autoCat = '외주비';
                else if (text.includes('주유') || text.includes('배송') || text.includes('회의')) autoCat = '경비 - 기타경비';
                else if (text.includes('홍보') || text.includes('촬영') || text.includes('다과')) autoCat = '경비 - 홍보비';

                added.push({
                  id: maxId, date: dateStr, category: autoCat, desc, vendor,
                  amount: outAmt, type: 'expense', method: text.includes('체크') ? '체크카드' : '계좌이체', note
                });
              }
            });

                <div className="flex justify-end gap-2 mt-5">
                  <button onClick={() => setBudgetModal({ open: false, data: null })} className="px-4 py-2 text-xs font-semibold text-stone-600 bg-stone-100 rounded-lg">취소</button>
                  <button onClick={() => saveBudget(budgetModal.data)} className="px-4 py-2 text-xs font-semibold text-white bg-stone-900 rounded-lg">저장</button>
                </div>
              </div>
            </div>
          )}

          {/* 확인 모달 */}
          {confirmModal.open && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl text-center">
                <p className="text-sm text-stone-700 mb-5">{confirmModal.message}</p>
                <div className="flex justify-center gap-2">
                  <button onClick={() => setConfirmModal({ open: false, message: '', onConfirm: null })} className="px-4 py-2 text-xs font-semibold text-stone-600 bg-stone-100 rounded-lg">취소</button>
                  <button onClick={confirmModal.onConfirm} className="px-4 py-2 text-xs font-semibold text-white bg-rose-600 rounded-lg">확인</button>
                </div>
              </div>
            </div>
          )}

          {/* 토스트 알림 */}
          {toast && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-lg">
              {toast}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
