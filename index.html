        function Dal2silBudgetApp() {
            const [activeTab, setActiveTab] = useState('budget');
            
            const [budgets, setBudgets] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY_BUDGETS);
                    return saved ? JSON.parse(saved) : INITIAL_BUDGETS;
                } catch { return INITIAL_BUDGETS; }
            });

            const [transactions, setTransactions] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY_TX);
                    return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
                } catch { return INITIAL_TRANSACTIONS; }
            });

            useEffect(() => {
                try { localStorage.setItem(STORAGE_KEY_BUDGETS, JSON.stringify(budgets)); } catch {}
            }, [budgets]);

            useEffect(() => {
                try { localStorage.setItem(STORAGE_KEY_TX, JSON.stringify(transactions)); } catch {}
            }, [transactions]);

            // 필터 및 검색
            const [searchTerm, setSearchTerm] = useState('');
            const [filterBudgetId, setFilterBudgetId] = useState('all');

            const [isBudgetModalOpen, setIsBudgetModalOpen] = useState(false);
            const [isTransactionModalOpen, setIsTransactionModalOpen] = useState(false);
            
            const [editingBudget, setEditingBudget] = useState(null);
            const [editingTransaction, setEditingTransaction] = useState(null);

            const [toastMessage, setToastMessage] = useState(null);
            const [isXlsxLoaded, setIsXlsxLoaded] = useState(false);

            useEffect(() => {
                if (window.XLSX) {
                    setIsXlsxLoaded(true);
                    return;
                }
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
                script.async = true;
                script.onload = () => setIsXlsxLoaded(true);
                document.body.appendChild(script);
            }, []);

            const showToast = (msg, type = 'success') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 3000);
            };

            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('ko-KR').format(Math.round(amount || 0));
            };

            const formatDate = (dateString) => {
                if (!dateString) return '';
                const date = new Date(dateString);
                if (isNaN(date)) return dateString;
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            };

            const generateId = () => Math.random().toString(36).substr(2, 9);

            const handleResetData = () => {
                if (window.confirm('모든 수정 내역을 지우고 초기 데이터(119건)로 되돌리시겠습니까?')) {
                    setBudgets(INITIAL_BUDGETS);
                    setTransactions(INITIAL_TRANSACTIONS);
                    localStorage.removeItem(STORAGE_KEY_BUDGETS);
                    localStorage.removeItem(STORAGE_KEY_TX);
                    showToast('초기 데이터로 복원되었습니다.');
                }
            };

            // --- 예산현황 집계 계산 ---
            const budgetData = useMemo(() => {
                let groupedItems = { '인건비': [], '외주비': [], '경비': [], '기타': [] };
                let catDirectUsage = {
                    '인건비': { used2026: 0, used2027: 0, usedAmount: 0 },
                    '외주비': { used2026: 0, used2027: 0, usedAmount: 0 },
                    '경비': { used2026: 0, used2027: 0, usedAmount: 0 },
                    '기타': { used2026: 0, used2027: 0, usedAmount: 0 },
                };

                let netCostBudget2026 = 0; let netCostBudget2027 = 0; let netCostBudget = 0;
                let netCostUsed = 0; let netCostUsed2026 = 0; let netCostUsed2027 = 0;
                let totalIncome = 0;

                // 카테고리 통합 지출 및 총 수입 계산
                transactions.forEach(t => {
                    const amt = Number(t.amount) || 0;
                    if (t.isIncome || t.budgetId === 'income') {
                        totalIncome += amt;
                        return;
                    }
                    if (t.budgetId && t.budgetId.startsWith('cat_')) {
                        const catName = t.budgetId.replace('cat_', '');
                        const targetCat = catDirectUsage[catName] ? catName : '기타';
                        const txYear = new Date(t.date).getFullYear();
                        catDirectUsage[targetCat].usedAmount += amt;
                        if (txYear === 2026) catDirectUsage[targetCat].used2026 += amt;
                        else if (txYear === 2027) catDirectUsage[targetCat].used2027 += amt;

                        netCostUsed += amt;
                        if (txYear === 2026) netCostUsed2026 += amt;
                        else if (txYear === 2027) netCostUsed2027 += amt;
                    }
                });

                budgets.forEach(budget => {
                    const amount2026 = Number(budget.amount2026) || 0;
                    const amount2027 = Number(budget.amount2027) || 0;
                    const totalAmount = amount2026 + amount2027;
                    let used2026 = 0; let used2027 = 0; let usedAmount = 0;

                    transactions
                        .filter(t => !t.isIncome && t.budgetId === budget.id)
                        .forEach(t => {
                            const amt = Number(t.amount) || 0;
                            usedAmount += amt;
                            const txYear = new Date(t.date).getFullYear();
                            if (txYear === 2026) used2026 += amt;
                            else if (txYear === 2027) used2027 += amt;
                        });
                    
                    const remaining = totalAmount - usedAmount;
                    const rate = totalAmount > 0 ? ((usedAmount / totalAmount) * 100).toFixed(1) : 0;

                    netCostBudget2026 += amount2026; netCostBudget2027 += amount2027; netCostBudget += totalAmount;
                    netCostUsed += usedAmount; netCostUsed2026 += used2026; netCostUsed2027 += used2027;

                    const enhancedBudget = { ...budget, amount: totalAmount, amount2026, amount2027, used2026, used2027, usedAmount, remaining, rate };
                    
                    if (groupedItems[budget.category]) groupedItems[budget.category].push(enhancedBudget);
                    else groupedItems['기타'].push(enhancedBudget);
                });

                const calcSummary = (net) => {
                    const adminFee = net * 0.05; const profit = net * 0.03; const opCost = net + adminFee + profit;
                    const vat = opCost * 0.1; const total = opCost + vat; const final = Math.floor(total / 100000) * 100000;
                    return { adminFee, profit, opCost, vat, total, final };
                };

                const s2026 = calcSummary(netCostBudget2026); const s2027 = calcSummary(netCostBudget2027);
                const sTotal = calcSummary(netCostBudget);

                return {
                    groupedItems,
                    catDirectUsage,
                    totalIncome,
                    currentBalance: totalIncome - netCostUsed,
                    summary: {
                        netCost: { b2026: netCostBudget2026, b2027: netCostBudget2027, budget: netCostBudget, used: netCostUsed, used2026: netCostUsed2026, used2027: netCostUsed2027 },
                        adminFee: { b2026: s2026.adminFee, b2027: s2027.adminFee, budget: sTotal.adminFee },
                        profit: { b2026: s2026.profit, b2027: s2027.profit, budget: sTotal.profit },
                        opCost: { b2026: s2026.opCost, b2027: s2027.opCost, budget: sTotal.opCost },
                        vat: { b2026: s2026.vat, b2027: s2027.vat, budget: sTotal.vat },
                        total: { b2026: s2026.total, b2027: s2027.total, budget: sTotal.total },
                        final: { b2026: s2026.final, b2027: s2027.final, budget: sTotal.final },
                    }
                };
            }, [budgets, transactions]);

            // 필터링된 사용내역
            const filteredTransactions = useMemo(() => {
                return transactions
                    .filter(tx => {
                        if (filterBudgetId !== 'all') {
                            if (filterBudgetId === 'income' && !(tx.isIncome || tx.budgetId === 'income')) return false;
                            if (filterBudgetId !== 'income' && tx.budgetId !== filterBudgetId) return false;
                        }
                        if (searchTerm.trim()) {
                            const q = searchTerm.toLowerCase();
                            return (
                                (tx.description || '').toLowerCase().includes(q) ||
                                (tx.merchant || '').toLowerCase().includes(q) ||
                                (tx.note || '').toLowerCase().includes(q) ||
                                (tx.date || '').includes(q)
                            );
                        }
                        return true;
                    })
                    .sort((a, b) => {
                        const dateDiff = new Date(b.date) - new Date(a.date);
                        if (dateDiff !== 0) return dateDiff;
                        return (b.no || 0) - (a.no || 0);
                    });
            }, [transactions, filterBudgetId, searchTerm]);

            // 비목 라벨 변환기
            const getBudgetLabel = (tx) => {
                if (tx.isIncome || tx.budgetId === 'income') return { type: 'income', text: '수입 / 입금' };
                if (tx.budgetId === 'cat_인건비') return { type: 'cat', text: '인건비 (통합)' };
                if (tx.budgetId === 'cat_외주비') return { type: 'cat', text: '외주비 (통합)' };
                const item = budgets.find(b => b.id === tx.budgetId);
                if (item) return { type: 'item', category: item.category, subCategory: item.subCategory, name: item.name };
                return { type: 'none', text: '미지정' };
            };

            // 엑셀 업로드
            const handleFileUpload = (e) => {
                if (!window.XLSX) {
                    showToast('엑셀 처리 기능을 불러오는 중입니다. 잠시 후 다시 시도해주세요.', 'error');
                    return;
                }
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = window.XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const jsonData = window.XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        
                        let headerIdx = -1;
                        for (let i = 0; i < Math.min(20, jsonData.length); i++) {
                            const rowStr = (jsonData[i] || []).join('').replace(/\s/g, '');
                            if (rowStr.includes('일자') || rowStr.includes('날짜') || rowStr.includes('거래일')) {
                                headerIdx = i;
                                break;
                            }
                        }

                        if (headerIdx === -1) {
                            showToast('엑셀 파일에서 올바른 헤더(날짜/일자 등)를 찾을 수 없습니다.', 'error');
                            return;
                        }

                        const headers = jsonData[headerIdx];
                        const rows = jsonData.slice(headerIdx + 1);
                        const newTransactions = [];
                        let successCount = 0;
                        let maxNo = transactions.reduce((max, t) => Math.max(max, t.no || 0), 0);

                        rows.forEach(row => {
                            if (!row || row.length === 0) return;
                            let dateStr = ''; let amount = 0; let desc = ''; let merchant = '';

                            headers.forEach((header, idx) => {
                                if (!header) return;
                                const h = header.toString().replace(/\s/g, '');
                                const cellValue = row[idx];
                                if (cellValue === undefined || cellValue === null) return;

                                if (h.includes('일자') || h.includes('날짜') || h.includes('거래일시')) {
                                    if (typeof cellValue === 'number') {
                                        const dateObj = new Date(Math.round((cellValue - 25569)*86400*1000));
                                        dateStr = dateObj.toISOString().split('T')[0];
                                    } else {
                                        dateStr = String(cellValue).trim().split(' ')[0].replace(/\./g, '-');
                                    }
                                } else if (h.includes('출금') || h.includes('찾으신') || h.includes('사용금액') || h.includes('지급')) {
                                    amount = Number(String(cellValue).replace(/,/g, ''));
                                } else if (h.includes('적요') || h.includes('기재')) {
                                    desc = String(cellValue);
                                } else if (h.includes('내용') || h.includes('거래처') || h.includes('취급점') || h.includes('가맹점')) {
                                    merchant = String(cellValue);
                                }
                            });

                            if (amount > 0 && dateStr) {
                                maxNo += 1;
                                newTransactions.push({
                                    id: generateId(),
                                    no: maxNo,
                                    date: dateStr,
                                    budgetId: 'b12',
                                    description: desc || '엑셀 자동입력',
                                    merchant: merchant || '',
                                    amount: amount,
                                    method: '계좌이체',
                                    note: '엑셀 업로드'
                                });
                                successCount++;
                            }
                        });

                        if (successCount > 0) {
                            setTransactions(prev => [...prev, ...newTransactions]);
                            showToast(`${successCount}건의 사용내역이 성공적으로 연동되었습니다!`);
                            setActiveTab('usage');
                        } else {
                            showToast('가져올 수 있는 출금 내역이 없습니다.', 'error');
                        }
                    } catch (err) {
                        showToast('엑셀 파일 처리 중 오류가 발생했습니다.', 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const handleBudgetSubmit = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const amount2026 = Number(formData.get('amount2026').replace(/,/g, ''));
                const amount2027 = Number(formData.get('amount2027').replace(/,/g, ''));
                const budgetData = {
                    id: editingBudget ? editingBudget.id : generateId(),
                    category: formData.get('category'), subCategory: formData.get('subCategory'), name: formData.get('name'),
                    amount2026: amount2026, amount2027: amount2027
                };
                if (editingBudget) {
                    setBudgets(budgets.map(b => b.id === editingBudget.id ? budgetData : b));
                    showToast('예산 항목이 수정되었습니다.');
                } else {
                    setBudgets([...budgets, budgetData]);
                    showToast('새로운 예산 항목이 추가되었습니다.');
                }
                setIsBudgetModalOpen(false);
            };

            const handleTransactionSubmit = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const budgetId = formData.get('budgetId');
                const isIncome = budgetId === 'income';
                const maxNo = transactions.reduce((max, t) => Math.max(max, t.no || 0), 0);
                const txData = {
                    id: editingTransaction ? editingTransaction.id : generateId(),
                    no: editingTransaction ? editingTransaction.no : maxNo + 1,
                    date: formData.get('date'),
                    budgetId: budgetId,
                    description: formData.get('description'),
                    merchant: formData.get('merchant'),
                    amount: Number(formData.get('amount').replace(/,/g, '')),
                    method: formData.get('method'),
                    note: formData.get('note'),
                    isIncome: isIncome
                };
                if (editingTransaction) {
                    setTransactions(transactions.map(t => t.id === editingTransaction.id ? txData : t));
                    showToast('사용 내역이 수정되었습니다.');
                } else {
                    setTransactions([txData, ...transactions]);
                    showToast('새로운 사용 내역이 추가되었습니다.');
                }
                setIsTransactionModalOpen(false);
            };

            const deleteBudget = (id) => {
                if (!window.confirm('이 예산 항목을 삭제하시겠습니까?')) return;
                setBudgets(budgets.filter(b => b.id !== id));
                showToast('예산 항목이 삭제되었습니다.');
            };

            const deleteTransaction = (id) => {
                if (!window.confirm('이 사용 내역을 삭제하시겠습니까?')) return;
                setTransactions(transactions.filter(t => t.id !== id));
                showToast('사용 내역이 삭제되었습니다.');
            };

            const CATEGORY_ORDER = ['인건비', '외주비', '경비', '기타'];

            return (
                <div className="min-h-screen pb-12">
                    {toastMessage && (
                        <div className={`fixed top-4 right-4 z-50 flex items-center px-4 py-3 rounded shadow-lg animate-fade-in-down ${
                        toastMessage.type === 'error' ? 'bg-red-100 text-red-800 border-l-4 border-red-500' : 'bg-green-100 text-green-800 border-l-4 border-green-500'
                        }`}>
                            {toastMessage.type === 'error' ? <Icons.AlertCircle className="w-5 h-5 mr-2" /> : <Icons.CheckCircle2 className="w-5 h-5 mr-2" />}
                            <span className="font-medium">{toastMessage.msg}</span>
                        </div>
                    )}

                    {/* 헤더 */}
                    <header className="bg-white shadow-sm border-b border-stone-200 sticky top-0 z-30">
                        <div className="max-w-[1300px] mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center gap-2">
                                    <div className="bg-stone-800 text-white p-2 rounded-lg">
                                        <Icons.PieChart className="w-5 h-5" />
                                    </div>
                                    <h1 className="text-lg sm:text-xl font-bold tracking-tight text-stone-900">&lt;스테이달이실&gt; 예산관리</h1>
                                </div>
                                <button
                                    onClick={handleResetData}
                                    className="flex items-center gap-1 text-xs text-stone-500 hover:text-stone-800 bg-stone-100 hover:bg-stone-200 px-2.5 py-1.5 rounded-lg transition-colors"
                                    title="초기 119건 데이터로 복원"
                                >
                                    <Icons.RotateCcw className="w-3.5 h-3.5" />
                                    <span className="hidden sm:inline">초기화</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-[1300px] mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        {/* 상단 핵심 요약 바 */}
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
                            <div className="bg-white p-4 rounded-xl border border-stone-200 shadow-sm">
                                <div className="text-xs font-medium text-stone-500 mb-1">총 입금액 (사업비+이자)</div>
                                <div className="text-lg sm:text-xl font-bold text-blue-700">{formatCurrency(budgetData.totalIncome)}원</div>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-stone-200 shadow-sm">
                                <div className="text-xs font-medium text-stone-500 mb-1">실제 사용금액 (누적)</div>
                                <div className="text-lg sm:text-xl font-bold text-rose-600">{formatCurrency(budgetData.summary.netCost.used)}원</div>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-stone-200 shadow-sm">
                                <div className="text-xs font-medium text-stone-500 mb-1">현재 통장 잔액 (계산)</div>
                                <div className="text-lg sm:text-xl font-bold text-emerald-700">{formatCurrency(budgetData.currentBalance)}원</div>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-stone-200 shadow-sm">
                                <div className="text-xs font-medium text-stone-500 mb-1">26년 입금 대비 집행률</div>
                                <div className="text-lg sm:text-xl font-bold text-stone-900">
                                    {budgetData.totalIncome > 0 ? ((budgetData.summary.netCost.used / budgetData.totalIncome) * 100).toFixed(1) : 0}%
                                </div>
                            </div>
                        </div>

                        {/* 탭 네비게이션 */}
                        <div className="flex space-x-1 bg-stone-200 p-1 rounded-xl mb-6 overflow-x-auto no-scrollbar">
                            {[
                                { id: 'budget', name: '예산현황', Icon: Icons.Wallet },
                                { id: 'usage', name: `사용내역 (${transactions.length})`, Icon: Icons.Receipt },
                                { id: 'file', name: '파일연동', Icon: Icons.Upload }
                            ].map((tab) => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex-1 flex items-center justify-center gap-2 py-2.5 px-4 text-sm font-medium rounded-lg transition-all duration-200 whitespace-nowrap ${
                                        activeTab === tab.id ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-600 hover:text-stone-900 hover:bg-stone-300/50'
                                    }`}
                                >
                                    <tab.Icon className="w-4 h-4" />
                                    {tab.name}
                                </button>
                            ))}
                        </div>

                        <div className="animate-fade-in">
                            {/* ===================== [예산현황 탭] ===================== */}
                            {activeTab === 'budget' && (
                                <div className="space-y-6">
                                    <div className="bg-white rounded-xl shadow-sm border border-stone-300 overflow-hidden">
                                        <div className="p-4 border-b border-stone-300 flex justify-between items-center bg-stone-50">
                                            <div>
                                                <h2 className="text-base sm:text-lg font-bold text-stone-800">2026-2027 운영 예산현황</h2>
                                                <p className="text-xs text-stone-500 mt-0.5">사용내역 탭의 지출 데이터가 실시간으로 합산됩니다.</p>
                                            </div>
                                            <button onClick={() => { setEditingBudget(null); setIsBudgetModalOpen(true); }} className="flex items-center gap-1.5 bg-stone-800 hover:bg-stone-700 text-white px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors whitespace-nowrap">
                                                <Icons.Plus className="w-4 h-4" /> 항목 추가
                                            </button>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-xs sm:text-sm text-left border-collapse min-w-[1180px]">
                                                <thead>
                                                    <tr className="bg-stone-200 text-stone-700 font-bold border-b border-stone-300">
                                                        <th className="border border-stone-300 p-2.5 text-center w-20">구분</th>
                                                        <th className="border border-stone-300 p-2.5 text-center w-32">비목</th>
                                                        <th className="border border-stone-300 p-2.5 text-center">내용</th>
                                                        <th className="border border-stone-300 p-2.5 text-center w-28 bg-stone-100">2026 금액</th>
                                                        <th className="border border-stone-300 p-2.5 text-center w-28 bg-rose-50 text-rose-700">26년 사용</th>
                                                        <th className="border border-stone-300 p-2.5 text-center w-28 bg-stone-100">2027 금액</th>
                                                        <th className="border border-stone-300 p-2.5 text-center w-28 bg-rose-50 text-rose-700">27년 사용</th>
                                                        <th className="border border-stone-300 p-2.5 text-center w-28 bg-stone-200">합계 (원)</th>
                                                        <th className="border border-stone-300 p-2.5 text-center w-28 bg-rose-100 text-rose-800">총 사용금액</th>
                                                        <th className="border border-stone-300 p-2.5 text-center w-28 bg-emerald-50 text-emerald-700">잔여예산</th>
                                                        <th className="border border-stone-300 p-2.5 text-center w-16">집행률</th>
                                                        <th className="border border-stone-300 p-2.5 text-center w-16">관리</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {CATEGORY_ORDER.map(category => {
                                                        const items = budgetData.groupedItems[category];
                                                        const direct = budgetData.catDirectUsage[category] || { used2026: 0, used2027: 0, usedAmount: 0 };
                                                        if (!items || items.length === 0) return null;
                                                        
                                                        const hasDirect = direct.usedAmount !== 0;
                                                        const rowSpanCount = items.length + (hasDirect ? 1 : 0);

                                                        const subTotal2026 = items.reduce((sum, item) => sum + (item.amount2026 || 0), 0);
                                                        const subTotal2027 = items.reduce((sum, item) => sum + (item.amount2027 || 0), 0);
                                                        const subTotalBudget = items.reduce((sum, item) => sum + item.amount, 0);
                                                        const subTotalUsed2026 = items.reduce((sum, item) => sum + (item.used2026 || 0), 0) + direct.used2026;
                                                        const subTotalUsed2027 = items.reduce((sum, item) => sum + (item.used2027 || 0), 0) + direct.used2027;
                                                        const subTotalUsed = items.reduce((sum, item) => sum + item.usedAmount, 0) + direct.usedAmount;
                                                        const subTotalRemaining = subTotalBudget - subTotalUsed;
                                                        const subTotalRate = subTotalBudget > 0 ? ((subTotalUsed / subTotalBudget) * 100).toFixed(1) : 0;

                                                        return (
                                                            <React.Fragment key={category}>
                                                                {items.map((item, index) => (
                                                                    <tr key={item.id} className="hover:bg-stone-50 transition-colors">
                                                                        {index === 0 && <td rowSpan={rowSpanCount} className="border border-stone-300 p-2.5 text-center font-bold bg-stone-100 align-middle">{category}</td>}
                                                                        <td className="border border-stone-300 p-2.5 text-center font-medium text-stone-700">{item.subCategory}</td>
                                                                        <td className="border border-stone-300 p-2.5">{item.name}</td>
                                                                        <td className="border border-stone-300 p-2.5 text-right bg-stone-50/50">{formatCurrency(item.amount2026 || 0)}</td>
                                                                        <td className="border border-stone-300 p-2.5 text-right text-rose-500">{formatCurrency(item.used2026)}</td>
                                                                        <td className="border border-stone-300 p-2.5 text-right bg-stone-50/50">{formatCurrency(item.amount2027 || 0)}</td>
                                                                        <td className="border border-stone-300 p-2.5 text-right text-rose-500">{formatCurrency(item.used2027)}</td>
                                                                        <td className="border border-stone-300 p-2.5 text-right bg-stone-100 font-bold">{formatCurrency(item.amount)}</td>
                                                                        <td className="border border-stone-300 p-2.5 text-right text-rose-600 font-bold">{formatCurrency(item.usedAmount)}</td>
                                                                        <td className={`border border-stone-300 p-2.5 text-right ${item.remaining < 0 ? 'text-red-600 font-bold' : 'text-emerald-600'}`}>{formatCurrency(item.remaining)}</td>
                                                                        <td className="border border-stone-300 p-2.5 text-right">{item.rate}%</td>
                                                                        <td className="border border-stone-300 p-2">
                                                                            <div className="flex justify-center gap-1">
                                                                                <button onClick={() => { setEditingBudget(item); setIsBudgetModalOpen(true); }} className="text-stone-400 hover:text-blue-600 p-1"><Icons.Edit2 className="w-3.5 h-3.5" /></button>
                                                                                <button onClick={() => deleteBudget(item.id)} className="text-stone-400 hover:text-red-600 p-1"><Icons.Trash2 className="w-3.5 h-3.5" /></button>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                                {hasDirect && (
                                                                    <tr className="bg-amber-50/50 text-stone-700 italic">
                                                                        <td className="border border-stone-300 p-2.5 text-center font-medium text-amber-800">{category} 통합</td>
                                                                        <td className="border border-stone-300 p-2.5 text-xs text-stone-500">월별 통합 정산 지출액</td>
                                                                        <td className="border border-stone-300 p-2.5 text-right text-stone-400">-</td>
                                                                        <td className="border border-stone-300 p-2.5 text-right text-rose-600 font-medium">{formatCurrency(direct.used2026)}</td>
                                                                        <td className="border border-stone-300 p-2.5 text-right text-stone-400">-</td>

                    {/* 모달: 예산 */}
                    {isBudgetModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                                <div className="flex justify-between items-center p-5 border-b border-stone-100">
                                    <h3 className="text-lg font-bold text-stone-900">{editingBudget ? '예산 항목 수정' : '새 예산 항목 추가'}</h3>
                                    <button onClick={() => setIsBudgetModalOpen(false)} className="text-stone-400 hover:text-stone-700"><Icons.X className="w-5 h-5" /></button>
                                </div>
                                <form onSubmit={handleBudgetSubmit} className="p-5 space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="block text-sm font-medium text-stone-700 mb-1">구분</label><input name="category" defaultValue={editingBudget?.category || ''} required className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-800 outline-none" /></div>
                                        <div><label className="block text-sm font-medium text-stone-700 mb-1">비목</label><input name="subCategory" defaultValue={editingBudget?.subCategory || ''} required className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-800 outline-none" /></div>
                                    </div>
                                    <div><label className="block text-sm font-medium text-stone-700 mb-1">내용 (항목명)</label><input name="name" defaultValue={editingBudget?.name || ''} required className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-800 outline-none" /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="block text-sm font-medium text-stone-700 mb-1">2026 금액 (원)</label><input type="number" name="amount2026" defaultValue={editingBudget?.amount2026 || 0} required className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-800 outline-none" /></div>
                                        <div><label className="block text-sm font-medium text-stone-700 mb-1">2027 금액 (원)</label><input type="number" name="amount2027" defaultValue={editingBudget?.amount2027 || 0} required className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-800 outline-none" /></div>
                                    </div>
                                    <div className="pt-4 flex gap-3">
                                        <button type="button" onClick={() => setIsBudgetModalOpen(false)} className="flex-1 px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-800 font-medium rounded-lg">취소</button>
                                        <button type="submit" className="flex-1 px-4 py-2 bg-stone-800 hover:bg-stone-900 text-white font-medium rounded-lg">저장</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 모달: 사용내역 */}
                    {isTransactionModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center p-5 border-b border-stone-100 sticky top-0 bg-white">
                                    <h3 className="text-lg font-bold text-stone-900">{editingTransaction ? '사용 내역 수정' : '새 사용 내역 추가'}</h3>
                                    <button onClick={() => setIsTransactionModalOpen(false)} className="text-stone-400 hover:text-stone-700"><Icons.X className="w-5 h-5" /></button>
                                </div>
                                <form onSubmit={handleTransactionSubmit} className="p-5 space-y-4">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label className="block text-sm font-medium text-stone-700 mb-1">날짜</label><input type="date" name="date" defaultValue={editingTransaction?.date || new Date().toISOString().split('T')[0]} required className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-800 outline-none" /></div>
                                        <div>
                                            <label className="block text-sm font-medium text-stone-700 mb-1">사용방법</label>
                                            <select name="method" defaultValue={editingTransaction?.method || '체크카드'} className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-800 outline-none bg-white">
                                                <option value="체크카드">체크카드</option>
                                                <option value="계좌이체">계좌이체</option>
                                                <option value="">해당없음</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-stone-700 mb-1">예산 항목 (비목)</label>
                                        <select name="budgetId" defaultValue={editingTransaction?.budgetId || 'b12'} required className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-800 outline-none bg-white">
                                            <option value="income">수입 / 입금 (사업비·이자)</option>
                                            <option value="cat_인건비">인건비 (통합 정산)</option>
                                            <option value="cat_외주비">외주비 (통합 정산)</option>
                                            {budgets.map(b => <option key={b.id} value={b.id}>[{b.category}/{b.subCategory}] {b.name}</option>)}
                                        </select>
                                    </div>
                                    <div><label className="block text-sm font-medium text-stone-700 mb-1">적요</label><input name="description" defaultValue={editingTransaction?.description || ''} required className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-800 outline-none" /></div>
                                    <div><label className="block text-sm font-medium text-stone-700 mb-1">사용처</label><input name="merchant" defaultValue={editingTransaction?.merchant || ''} className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-800 outline-none" /></div>
                                    <div>
                                        <label className="block text-sm font-medium text-stone-700 mb-1">금액 (원) <span className="text-xs font-normal text-stone-400">※ 결제 취소는 마이너스(-) 입력</span></label>
                                        <input type="number" name="amount" defaultValue={editingTransaction?.amount ?? ''} required className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-800 outline-none" />
                                    </div>
                                    <div><label className="block text-sm font-medium text-stone-700 mb-1">비고</label><input name="note" defaultValue={editingTransaction?.note || ''} className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-800 outline-none" /></div>
                                    <div className="pt-4 flex gap-3">
                                        <button type="button" onClick={() => setIsTransactionModalOpen(false)} className="flex-1 px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-800 font-medium rounded-lg">취소</button>
                                        <button type="submit" className="flex-1 px-4 py-2 bg-stone-800 hover:bg-stone-900 text-white font-medium rounded-lg">저장</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dal2silBudgetApp />);
    </script>
</body>
</html>
